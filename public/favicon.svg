<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep dark squircle background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#090a0f" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Rotating orbital ring with native SMIL animation -->
  <g transform="translate(32, 32)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="75 75" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- High-contrast bold typography G -->
  <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Syne', 'Segoe UI', sans-serif" font-weight="900" font-size="31" fill="#ffffff" text-anchor="middle">G</text>

  <!-- Pulsing green status beacon -->
  <circle cx="48" cy="16" r="3" fill="#10b981" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="16" r="4.5" fill="none" stroke="#10b981" stroke-width="1">
    <animate attributeName="r" values="3;6.5" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
