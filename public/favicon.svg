<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="cursorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Terminal Window Body -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#090b12" stroke="#1e293b" stroke-width="2"/>

  <!-- Terminal Title Bar -->
  <path d="M 2 16 L 2 16 A 14 14 0 0 1 16 2 L 48 2 A 14 14 0 0 1 62 16 L 62 16 Z" fill="#121826"/>
  <line x1="2" y1="16" x2="62" y2="16" stroke="#1e293b" stroke-width="1"/>

  <!-- Traffic Light Window Controls (🔴 🟡 🟢) -->
  <circle cx="9.5" cy="9" r="2.5" fill="#ef4444"/>
  <circle cx="16.5" cy="9" r="2.5" fill="#f59e0b"/>
  <!-- Active Green Online Pulse -->
  <circle cx="23.5" cy="9" r="2.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Command Prompt '>' in Electric Cyan -->
  <text x="8" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Syne', 'Inter', monospace, sans-serif" font-weight="900" font-size="21" fill="#38bdf8">&gt;</text>

  <!-- Initial 'G' in Crisp White -->
  <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Syne', 'Inter', sans-serif" font-weight="900" font-size="28" fill="#ffffff">G</text>

  <!-- Authentic Blinking Emerald Terminal Cursor '_' -->
  <rect x="47" y="40" width="10" height="4.5" rx="1.5" fill="#10b981" filter="url(#cursorGlow)">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.51;0.99;1" dur="1.06s" repeatCount="indefinite"/>
  </rect>
</svg>
